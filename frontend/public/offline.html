<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - DevNote Stories</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #374151;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #111827; }
    p { margin-bottom: 2rem; color: #6b7280; max-width: 400px; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <h1>You're Offline</h1>
  <p>It looks like you've lost your connection. The page you are trying to reach is not cached.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
